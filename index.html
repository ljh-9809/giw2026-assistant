<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIW 2026 학회 비서 · BIOINFO/GIW ISCB-Asia</title>
<style>
  :root{
    --paper:#f7f5f0; --card:#fffdf8; --ink:#1f2328; --ink2:#5a6169; --line:#e3ded3;
    --accent:#2f5d50; --accent2:#8a5a2b; --hl:#f2e9d8; --star:#c8921f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header{border-bottom:1px solid var(--line);background:var(--card)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  .hero{padding:22px 0 16px}
  .hero h1{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
  .hero p{margin:0;color:var(--ink2);font-size:13.5px}
  .tabs{display:flex;gap:2px;flex-wrap:wrap;margin-top:16px}
  .tabs button{appearance:none;border:1px solid var(--line);border-bottom:none;background:transparent;
    padding:8px 15px;border-radius:7px 7px 0 0;font:inherit;font-size:14px;color:var(--ink2);cursor:pointer}
  .tabs button.on{background:var(--paper);color:var(--ink);font-weight:600;position:relative;top:1px}
  main{padding:20px 0 60px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=text],input[type=password],select,textarea{font:inherit;padding:8px 11px;border:1px solid var(--line);
    border-radius:7px;background:var(--card);color:var(--ink)}
  input[type=text]{min-width:260px;flex:1}
  .chip{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:4px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;
    padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--accent)}
  .muted{color:var(--ink2);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-bottom:9px}
  .card.hit{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
  .card h3{margin:0 0 5px;font-size:15.5px;font-weight:650;letter-spacing:-.005em}
  .meta{font-size:12.5px;color:var(--ink2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .tag{font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--ink2);background:var(--paper)}
  .tag.num{font-variant-numeric:tabular-nums;font-weight:650;color:var(--accent2);border-color:var(--accent2)}
  .star{cursor:pointer;font-size:16px;line-height:1;color:#cfc8b8;user-select:none;margin-left:auto}
  .star.on{color:var(--star)}
  .talks{margin:9px 0 0;padding:9px 0 0;border-top:1px dashed var(--line)}
  .talk{display:flex;gap:10px;padding:5px 0;font-size:13.5px;align-items:flex-start}
  .talk .t{color:var(--accent2);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:92px;font-size:12.5px;padding-top:1px}
  .talk .who{color:var(--ink2);font-size:12.5px}
  .daygrp{margin:22px 0 10px;font-size:14px;font-weight:700;color:var(--accent);
    border-bottom:1px solid var(--line);padding-bottom:5px}
  mark{background:var(--hl);padding:0 2px;border-radius:2px}
  .chat{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:14px;min-height:140px}
  .msg{margin-bottom:12px}
  .msg .role{font-size:12px;color:var(--ink2);margin-bottom:3px}
  .msg .body{white-space:pre-wrap;font-size:14.5px}
  .msg.me .body{background:var(--hl);border-radius:7px;padding:8px 11px;display:inline-block}
  details.setup{margin-top:12px;font-size:13px;color:var(--ink2)}
  footer{border-top:1px solid var(--line);padding:16px 0;font-size:12.5px;color:var(--ink2)}
  .pill{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink2)}
  .hide{display:none}
  @media (max-width:640px){ .talk .t{min-width:76px} .hero h1{font-size:19px} }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hero">
      <h1>GIW 2026 학회 비서</h1>
      <p id="ev"></p>
      <div class="tabs">
        <button data-tab="rec" class="on">추천</button>
        <button data-tab="prog">프로그램</button>
        <button data-tab="post">포스터</button>
        <button data-tab="mine">내 일정</button>
        <button data-tab="ai">AI 질문</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- 추천 -->
  <section id="tab-rec">
    <div class="bar">
      <input type="text" id="kw" placeholder="관심 키워드 (쉼표로 구분) 예: pancreatic, long-read, isoform">
      <button class="btn" id="kwgo">적용</button>
      <button class="btn ghost" id="kwreset">기본값</button>
      <select id="sortsel"><option value="score">관련도순</option><option value="time">시간순</option></select>
    </div>
    <div class="bar" id="presets"></div>
    <p class="muted" id="recnote"></p>
    <div id="recout"></div>
  </section>

  <!-- 프로그램 -->
  <section id="tab-prog" class="hide">
    <div class="bar">
      <input type="text" id="q" placeholder="세션·발표 검색 (제목, 연사, 소속)">
      <select id="day">
        <option value="">전체 날짜</option>
        <option value="2026-11-17">11/17 화</option>
        <option value="2026-11-18">11/18 수</option>
        <option value="2026-11-19">11/19 목</option>
        <option value="2026-11-20">11/20 금</option>
      </select>
      <select id="track"><option value="">전체 트랙</option></select>
      <label class="pill"><input type="checkbox" id="hideEv"> 커피·등록 등 제외</label>
    </div>
    <p class="muted" id="prognote"></p>
    <div id="progout"></div>
  </section>

  <!-- 포스터 -->
  <section id="tab-post" class="hide">
    <div class="bar">
      <input type="text" id="pq" placeholder="포스터 검색 (제목, 저자, 소속, 번호)">
      <span class="muted">총 <b id="pcount"></b>개 · 11/18(수) 17:00-18:00, 11/19(목) 16:30-18:00 @ The Commons Lobby</span>
    </div>
    <div id="postout"></div>
  </section>

  <!-- 내 일정 -->
  <section id="tab-mine" class="hide">
    <div class="bar">
      <button class="btn" id="ics">캘린더(.ics) 내보내기</button>
      <button class="btn ghost" id="share">링크로 내보내기</button>
      <button class="btn ghost" id="clear">전부 지우기</button>
    </div>
    <p class="muted">★ 를 누른 세션·포스터가 시간순으로 모입니다. 브라우저에 저장돼요.</p>
    <div id="mineout"></div>
  </section>

  <!-- AI -->
  <section id="tab-ai" class="hide">
    <div class="chat" id="chat">
      <p class="muted">예) "췌장암 관련 포스터 뭐 있어?" · "11/20 오전에 long-read 세션 어디서 해?" · "single-cell 하는 연세대 사람 찾아줘"</p>
    </div>
    <div class="bar" style="margin-top:10px">
      <input type="text" id="ask" placeholder="학회 프로그램·포스터에 대해 물어보세요">
      <button class="btn" id="asksend">질문</button>
    </div>
    <details class="setup">
      <summary>AI 연결 설정</summary>
      <p>기본은 <b>키 없이 동작하는 로컬 검색</b>입니다. 아래에 프록시 주소를 넣으면 LLM이 문장으로 답합니다.</p>
      <div class="bar">
        <input type="text" id="ep" placeholder="프록시 엔드포인트 URL (예: https://xxx.workers.dev/ask)">
        <button class="btn ghost" id="epsave">저장</button>
      </div>
      <div class="bar">
        <input type="password" id="apikey" placeholder="(선택) 본인 Anthropic API 키 — 브라우저에만 저장">
        <button class="btn ghost" id="keysave">저장</button>
      </div>
    </details>
  </section>

</main>

<footer class="wrap">
  <span id="foot"></span>
</footer>

num":"P337","url":"https://virtual.oxfordabstracts.com/event/77416/submission/458","title":"Prior sensitivity and metric discordance in survival prior-fitted networks: a simulation study","authors":["Sung Chul Yea"],"affils":["Yonsei University"]},{"num":"P338","url":"https://virtual.oxfordabstracts.com/event/77416/submission/464","title":"VirtualTissue: A Transformer-Based Foundation Model for Predicting Neighboring Spatial Spots and Niche-Specific Genes from Single-Spot Gene Expression Profiles","authors":["Jahanzeb Saqib","Gahyun Kim","Junil Kim"],"affils":["Soongsil University"]},{"num":"P339","url":"https://virtual.oxfordabstracts.com/event/77416/submission/126","title":"A heart cell atlas reveals cell-type diversity enabling prediction of disease severity and drug response","authors":["Jiyeon Park1","Heeseon Jo2","Taegyu Woo3","Chaewon Kim1","Cherin Lee1","Junyoung Kim1","Hyeonkyu Kim1","Inuk Jung3","Haeseung Lee2","Junil Kim1,4"],"affils":["1 Department of Bioinformatics, Soongsil University","2 Department of Pharmacy, College of Pharmacy and Research Institute for Drug Development, Pusan National University","3 School of Computer Science and Engineering, Kyungpook National University","4 School of Systems Biomedical Science, Soongsil University"]},{"num":"P340","url":"https://virtual.oxfordabstracts.com/event/77416/submission/188","title":"Deciphering the Gene Regulatory Mechanisms Underlying the Functional Maturation of Induced Pluripotent Stem Cell-Derived Cardiomyocytes","authors":["Cherin Lee1","Jun-Young Kim1","Dongyue No2","Soonjung Park3","Junil Kim1","Man-Ryul Lee2","Sung-Hwan Moon4"],"affils":["1 Department of Bioinformatics, Soongsil University","2 Department of Stem Cell and Regenerative Biotechnology, KU Institute of Science and Technology, Konkuk University","3 R&D Center, Biosolvix Co. Ltd","4 Department of Animal Science and Technology, Chung-Ang University"]},{"num":"P341","url":"https://virtual.oxfordabstracts.com/event/77416/submission/200","title":"Single-cell ATAC-seq Analysis Reveals Epigenetic Regulatory Landscapes Driving Dedifferentiation in Thyroid Carcinoma","authors":["Hoe-Bin Chung1","Woo-Seok Cha1","Seung-Yoon Song1","Eun-Hye Joo2","Sun Wook Cho2","Jae-Kyung Won3","Young Joo Park2","Junil Kim1,4"],"affils":["1 Department of Bioinformatics, Soongsil University, 369 Sangdo-Ro, Dongjak-Gu, Seoul 06978, Republic of Korea","2 Department of Internal Medicine, Seoul National University College of Medicine, Seoul 03080, Republic of Korea","3 Department of Pathology, Seoul National University College of Medicine, Seoul 03080, Republic of Korea","4 Department of Systems Biomedical Science, Soongsil University, 369 Sangdo-Ro, Dongjak-Gu, Seoul 06978, Republic of Korea"]},{"num":"P342","url":"https://virtual.oxfordabstracts.com/event/77416/submission/110","title":"TENET+: a tool for reconstructing gene networks by integrating single cell expression and chromatin accessibility data","authors":["Hyeonkyu Kim1","Hoebin Chung1","Hwisoo Choi1","Bokim Cho2","Kyoung-Jae Won3","Dongha Kim2","Junil Kim1,4"],"affils":["1 Department of Bioinformatics, Soongsil University, 369 Sangdo-Ro, Dongjak-Gu, Seoul 06978","2 Department of Anatomy, College of Medicine, The Catholic University of Korea, Seoul 06591, Republic of Korea","3 Computational Biomedicine, Cedars-Sinai Medical Center, Los Angeles, CA 90069, USA","4 School of Systems Biomedical Science, Soongsil University, 369 Sangdo-Ro, Dongjak-Gu, Seoul 06978, Republic of Korea"]},{"num":"P343","url":"https://virtual.oxfordabstracts.com/event/77416/submission/106","title":"Multi-omic Single-cell Atlas Construction to Elucidate Cellular Heterogeneity and Developmental Trajectories in Cardiovascular Disease and Aging","authors":["Seungyoon Song1","Hyeonkyu Kim1","Junyoung Kim2","Cherin Lee1","Hun-jun Park3","Man Ryul Lee4","Junil Kim1"],"affils":["1 Soongsil University","2 LNC Bio","3 Catholic University","4 Konkuk University"]},{"num":"P344","url":"https://virtual.ox <script>
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const S = DATA.sessions, P = DATA.posters;
const DEFAULT_KW = "pancreatic, PDAC, long-read, nanopore, isoform, splicing, transcriptome, metastasis, EMT, cancer genomics, single-cell, spatial, RNA-seq, multi-omics";
const HEAVY = /pancrea|pdac|long.?read|nanopore|pacbio|isoform|splic|metasta|\bemt\b/i;
const DOW = {'2026-11-17':'화','2026-11-18':'수','2026-11-19':'목','2026-11-20':'금'};
const NOISE = /^(Coffee break|Registration|Lunch|Welcome Reception|Closing|Opening Ceremony)/i;

document.getElementById('ev').textContent =
  DATA.event.name + ' · ' + DATA.event.dates.replace(/2026-/g,'').replace(/-/g,'/') + ' · ' + DATA.event.venue;
document.getElementById('foot').innerHTML =
  '데이터 출처: <a href="'+DATA.event.source+'" target="_blank" rel="noopener">Oxford Abstracts 공식 프로그램</a> · ' +
  '수집 ' + DATA.event.scraped.slice(0,10) + ' · 세션 ' + S.length + '개 / 발표 ' +
  S.reduce((a,s)=>a+s.talks.length,0) + '개 / 포스터 ' + P.length + '개 · 비공식 보조 도구';

/* ---------- storage ---------- */
const LS = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem('giw26_'+k)) ?? d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('giw26_'+k, JSON.stringify(v)); }catch(e){} }
};
let marks = LS.get('marks', []);
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get('bm')) { marks = Array.from(new Set(marks.concat(hash.get('bm').split(',')))); LS.set('marks', marks); }
const isMarked = id => marks.includes(id);
function toggleMark(id){
  marks = isMarked(id) ? marks.filter(x=>x!==id) : marks.concat([id]);
  LS.set('marks', marks); render();
}

/* ---------- helpers ---------- */
const esc = s => (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(text, terms){
  let t = esc(text);
  terms.filter(x=>x.length>1).forEach(k=>{
    t = t.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');
  });
  return t;
}
const sText = s => [s.title, s.track, s.room, s.desc, ...s.talks.map(t=>t.title+' '+t.speaker+' '+t.affil)].join(' ');
const pText = p => [p.num, p.title, p.authors.join(' '), p.affils.join(' ')].join(' ');
function scoreOf(text, kws){
  const t = text.toLowerCase(); let sc = 0; const hits = [];
  kws.forEach(k=>{ if(!k) return; if (t.includes(k.toLowerCase())) { sc += HEAVY.test(k) ? 3 : 1; hits.push(k); } });
  return { sc, hits };
}
function dayLabel(d){ return d.slice(5).replace('-','/') + ' (' + (DOW[d]||'') + ')'; }
function startISO(date, time){
  const t = (time||'09:00-09:00').split('-')[0];
  return date.replace(/-/g,'') + 'T' + t.replace(':','') + '00';
}
function endISO(date, time){
  const parts = (time||'09:00-10:00').split('-');
  return date.replace(/-/g,'') + 'T' + (parts[1]||parts[0]).replace(':','') + '00';
}

/* ---------- cards ---------- */
function sessionCard(s, terms, openTalks){
  const id = 'S'+s.id;
  const talks = (openTalks ? s.talks : s.talks.filter(t=>!terms.length || scoreOf(t.title+' '+t.speaker+' '+t.affil, terms).sc>0));
  const list = talks.length ? '<div class="talks">' + talks.map(t=>
      '<div class="talk"><span class="t">'+esc(t.time)+'</span><span><a href="'+esc(t.url||'#')+'" target="_blank" rel="noopener">'+
      hl(t.title, terms)+'</a>'+ (t.speaker? '<div class="who">'+hl(t.speaker,terms)+(t.affil?' · '+hl(t.affil,terms):'')+'</div>':'') +
      '</span></div>').join('') + '</div>' : '';
  return '<div class="card'+(terms.length&&scoreOf(sText(s),terms).sc>=3?' hit':'')+'">'+
    '<div class="meta"><span class="tag">'+dayLabel(s.date)+'</span><span class="tag">'+esc(s.time)+'</span>'+
    (s.room?'<span class="tag">'+esc(s.room)+'</span>':'')+(s.track?'<span class="tag">'+esc(s.track)+'</span>':'')+
    '<span class="star'+(isMarked(id)?' on':'')+'" data-id="'+id+'" title="내 일정에 추가">'+(isMarked(id)?'★':'☆')+'</span></div>'+
    '<h3><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+hl(s.title, terms)+'</a></h3>'+
    (s.desc?'<p class="muted">'+hl(s.desc, terms)+'</p>':'')+ list + '</div>';
}
function posterCard(p, terms){
  const id = p.num;
  return '<div class="card'+(terms.length&&scoreOf(pText(p),terms).sc>=3?' hit':'')+'">'+
    '<div class="meta"><span class="tag num">'+esc(p.num)+'</span>'+(ME.includes(p.num)?'<span class="tag" style="border-color:var(--accent);color:var(--accent)">내 포스터</span>':'')+
    '<span class="star'+(isMarked(id)?' on':'')+'" data-id="'+id+'">'+(isMarked(id)?'★':'☆')+'</span></div>'+
    '<h3><a href="'+esc(p.url||'#')+'" target="_blank" rel="noopener">'+hl(p.title, terms)+'</a></h3>'+
    '<div class="muted">'+hl(p.authors.join(', '), terms)+'</div>'+
    '<div class="muted" style="font-size:12.5px">'+hl(p.affils.join(' · '), terms)+'</div></div>';
}

/* ---------- tabs ---------- */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on', x===b));
  ['rec','prog','post','mine','ai'].forEach(t=>
    document.getElementById('tab-'+t).classList.toggle('hide', t!==b.dataset.tab));
});

/* ---------- 추천 ---------- */
const PRESETS = {
  '췌장암·전이':'pancreatic, PDAC, metastasis, liver metastasis, EMT',
  'Long-read·Isoform':'long-read, nanopore, PacBio, isoform, splicing, transcriptome',
  '암 유전체':'cancer, tumor, oncology, mutation, genomics, ctDNA',
  '단일세포·공간':'single-cell, scRNA, spatial, cell type, microenvironment',
  'AI·머신러닝':'deep learning, machine learning, foundation model, LLM, agent',
  '마이크로바이옴':'microbiome, metagenom, gut, bacteria',
  '단백질·구조':'protein, structure, docking, AlphaFold, binding'
};
let SORT = 'score';
const ME = (new URLSearchParams(location.search).get('me')||'').toUpperCase().split(',').filter(Boolean);
function kws(){ return (document.getElementById('kw').value||'').split(',').map(x=>x.trim()).filter(Boolean); }
document.getElementById('presets').innerHTML = Object.keys(PRESETS).map(k=>'<span class="chip" data-p="'+k+'">'+k+'</span>').join('');
document.getElementById('presets').onclick = e=>{
  const k = e.target.dataset.p; if(!k) return;
  document.getElementById('kw').value = PRESETS[k]; renderRec();
};
document.getElementById('sortsel').onchange = e=>{ SORT = e.target.value; renderRec(); };
document.getElementById('kwgo').onclick = renderRec;
document.getElementById('kwreset').onclick = ()=>{ document.getElementById('kw').value = DEFAULT_KW; renderRec(); };
document.getElementById('kw').addEventListener('keydown', e=>{ if(e.key==='Enter') renderRec(); });

function renderRec(){
  const terms = kws(); LS.set('kw', document.getElementById('kw').value);
  const ss = S.filter(s=>!s.isPoster && !NOISE.test(s.title))
    .map(s=>{
      const head = scoreOf(s.title+' '+s.desc, terms);
      const best = s.talks.reduce((m,t)=>Math.max(m, scoreOf(t.title+' '+t.speaker+' '+t.affil, terms).sc), 0);
      const nMatch = s.talks.filter(t=>scoreOf(t.title+' '+t.speaker+' '+t.affil, terms).sc>=3).length;
      return { s, sc: head.sc*2 + best + nMatch, hits: head.hits };
    }).filter(x=>x.sc>=3)
    .sort((a,b)=> SORT==='time' ? (a.s.date+a.s.time).localeCompare(b.s.date+b.s.time)
                                : (b.sc-a.sc || (a.s.date+a.s.time).localeCompare(b.s.date+b.s.time)));
  const pp = P.map(p=>({p, ...scoreOf(pText(p), terms)})).filter(x=>x.sc>=3).sort((a,b)=>b.sc-a.sc);
  document.getElementById('recnote').textContent =
    '키워드 '+terms.length+'개 기준 · 관련 세션 '+ss.length+'개, 관련 포스터 '+pp.length+'개';
  document.getElementById('recout').innerHTML =
    '<div class="daygrp">관련 세션 (점수순)</div>' + (ss.length? ss.map(x=>sessionCard(x.s, terms, false)).join('') : '<p class="muted">해당 없음</p>') +
    '<div class="daygrp">관련 포스터 (점수순)</div>' + (pp.length? pp.map(x=>posterCard(x.p, terms)).join('') : '<p class="muted">해당 없음</p>');
}

/* ---------- 프로그램 ---------- */
const trackSel = document.getElementById('track');
Array.from(new Set(S.map(s=>s.track).filter(Boolean))).sort().forEach(t=>{
  const o=document.createElement('option'); o.value=t; o.textContent=t; trackSel.appendChild(o);
});
['q','day','track','hideEv'].forEach(id=>document.getElementById(id).addEventListener('input', renderProg));
function renderProg(){
  const q = document.getElementById('q').value.trim();
  const terms = q? q.split(/\s+/):[];
  const day = document.getElementById('day').value, tr = trackSel.value, hide = document.getElementById('hideEv').checked;
  let list = S.filter(s=> (!day||s.date===day) && (!tr||s.track===tr) && (!hide || !NOISE.test(s.title)));
  if (q) list = list.filter(s=> terms.every(t=> sText(s).toLowerCase().includes(t.toLowerCase())));
  document.getElementById('prognote').textContent = list.length+'개 세션';
  let html='', cur='';
  list.forEach(s=>{ if(s.date!==cur){ cur=s.date; html += '<div class="daygrp">'+dayLabel(cur)+'</div>'; }
    html += sessionCard(s, terms, !q); });
  document.getElementById('progout').innerHTML = html || '<p class="muted">결과 없음</p>';
}

/* ---------- 포스터 ---------- */
document.getElementById('pcount').textContent = P.length;
document.getElementById('pq').addEventListener('input', renderPost);
function renderPost(){
  const q = document.getElementById('pq').value.trim();
  const terms = q? q.split(/\s+/):[];
  let list = P;
  if (q) list = P.filter(p=> terms.every(t=> pText(p).toLowerCase().includes(t.toLowerCase())));
  document.getElementById('postout').innerHTML =
    '<p class="muted">'+list.length+'개</p>' + list.slice(0,400).map(p=>posterCard(p, terms)).join('');
}

/* ---------- 내 일정 ---------- */
function myItems(){
  const out=[];
  marks.forEach(id=>{
    if (id.startsWith('S')) { const s=S.find(x=>'S'+x.id===id); if(s) out.push({type:'s', date:s.date, time:s.time, obj:s}); }
    else { const p=P.find(x=>x.num===id); if(p) out.push({type:'p', date:'2026-11-18', time:'17:00-18:00', obj:p}); }
  });
  return out.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
function renderMine(){
  const items = myItems();
  if(!items.length){ document.getElementById('mineout').innerHTML='<p class="muted">아직 비어 있어요. ★ 를 눌러 담아보세요.</p>'; return; }
  let html='', cur='';
  items.forEach(it=>{ if(it.date!==cur){ cur=it.date; html+='<div class="daygrp">'+dayLabel(cur)+'</div>'; }
    html += it.type==='s' ? sessionCard(it.obj, [], true) : posterCard(it.obj, []); });
  document.getElementById('mineout').innerHTML = html;
}
document.getElementById('clear').onclick = ()=>{ marks=[]; LS.set('marks',marks); render(); };
document.getElementById('share').onclick = ()=>{
  const u = location.origin+location.pathname+'#bm='+marks.join(',');
  navigator.clipboard && navigator.clipboard.writeText(u);
  alert('링크를 복사했어요:\n'+u);
};
document.getElementById('ics').onclick = ()=>{
  const items = myItems();
  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//GIW2026 assistant//KO\r\nCALSCALE:GREGORIAN\r\n';
  items.forEach((it,i)=>{
    const title = it.type==='s' ? it.obj.title : (it.obj.num+' '+it.obj.title);
    const loc = it.type==='s' ? (it.obj.room||'Yonsei University') : 'The Commons Lobby';
    const url = it.obj.url||'';
    ics += 'BEGIN:VEVENT\r\nUID:giw26-'+i+'-'+Date.now()+'@local\r\n'+
      'DTSTART;TZID=Asia/Seoul:'+startISO(it.date,it.time)+'\r\n'+
      'DTEND;TZID=Asia/Seoul:'+endISO(it.date,it.time)+'\r\n'+
      'SUMMARY:'+title.replace(/[\r\n,;]/g,' ')+'\r\nLOCATION:'+loc.replace(/[\r\n,;]/g,' ')+'\r\n'+
      'DESCRIPTION:'+url+'\r\nBEGIN:VALARM\r\nTRIGGER:-PT15M\r\nACTION:DISPLAY\r\nDESCRIPTION:'+
      title.replace(/[\r\n,;]/g,' ')+'\r\nEND:VALARM\r\nEND:VEVENT\r\n';
  });
  ics += 'END:VCALENDAR\r\n';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
  a.download='giw2026_my_schedule.ics'; a.click();
};

/* ---------- AI ---------- */
const chat = document.getElementById('chat');
document.getElementById('ep').value = LS.get('endpoint','') || '';
document.getElementById('apikey').value = LS.get('apikey','') || '';
document.getElementById('epsave').onclick = ()=>{ LS.set('endpoint', document.getElementById('ep').value.trim()); alert('저장됨'); };
document.getElementById('keysave').onclick = ()=>{ LS.set('apikey', document.getElementById('apikey').value.trim()); alert('저장됨 (이 브라우저에만)'); };

function retrieve(q, n){
  const terms = q.toLowerCase().match(/[a-z0-9가-힣\-]+/g)||[];
  const score = txt => { const t=txt.toLowerCase(); let s=0; terms.forEach(k=>{ if(k.length>1 && t.includes(k)) s += HEAVY.test(k)?3:1; }); return s; };
  const items = [];
  S.filter(s=>!s.isPoster).forEach(s=>{
    items.push({ s: score(sText(s)), kind:'session', label:'['+dayLabel(s.date)+' '+s.time+' '+s.room+'] '+s.title+
      (s.talks.length? '\n  - '+s.talks.map(t=>t.time+' '+t.title+' ('+t.speaker+', '+t.affil+')').join('\n  - '):''), url:s.url });
  });
  P.forEach(p=> items.push({ s: score(pText(p)), kind:'poster',
      label:'['+p.num+' 포스터 11/18 17:00, 11/19 16:30 @Commons Lobby] '+p.title+' — '+p.authors.join(', ')+' ('+p.affils.join('; ')+')', url:p.url }));
  return items.filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,n);
}
function say(role, text){
  const d=document.createElement('div'); d.className='msg'+(role==='me'?' me':'');
  d.innerHTML='<div class="role">'+(role==='me'?'나':'학회 비서')+'</div><div class="body"></div>';
  d.querySelector('.body').textContent = text; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
async function ask(){
  const box=document.getElementById('ask'); const q=box.value.trim(); if(!q) return;
  box.value=''; say('me', q);
  const hits = retrieve(q, 30);
  const ctx = hits.map(h=>h.label).join('\n\n');
  const ep = LS.get('endpoint',''), key = LS.get('apikey','');
  const sys = '너는 BIOINFO/GIW ISCB-Asia 2026 학회(2026년 11월 17-20일, 연세대학교) 안내 비서야. '+
    '아래 "학회 데이터"에만 근거해서 한국어로 간결하게 답해. 없는 정보는 지어내지 말고 모른다고 해. '+
    '세션은 날짜·시간·장소를, 포스터는 번호(Pxxx)를 꼭 같이 알려줘.';
  const user = '학회 데이터:\n'+ctx+'\n\n질문: '+q;
  const pending = say('bot','생각 중...');
  try{
    let answer='';
    if (ep){
      const r = await fetch(ep,{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({question:q, context:ctx, system:sys})});
      const j = await r.json();
      answer = j.answer || j.content?.[0]?.text || JSON.stringify(j).slice(0,500);
    } else if (key){
      const r = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
        headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01',
                 'anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-5-20250929',max_tokens:1200,system:sys,
          messages:[{role:'user',content:user}]})});
      const j = await r.json();
      answer = j.content?.[0]?.text || (j.error?.message||'오류');
    } else {
      answer = hits.length ?
        '(로컬 검색 결과 · AI 연결 안 됨)\n\n'+hits.slice(0,12).map((h,i)=>(i+1)+'. '+h.label.split('\n')[0]).join('\n')
        : '관련된 세션이나 포스터를 못 찾았어요. 다른 키워드로 물어봐 주세요.';
    }
    pending.querySelector('.body').textContent = answer;
    if (hits.length){
      const links=document.createElement('div'); links.className='muted'; links.style.marginTop='6px';
      links.innerHTML = '근거: '+hits.slice(0,5).map(h=>'<a href="'+h.url+'" target="_blank" rel="noopener">'+
        h.label.slice(0,40).replace(/</g,'&lt;')+'…</a>').join(' · ');
      pending.appendChild(links);
    }
  }catch(e){ pending.querySelector('.body').textContent = '오류: '+e; }
}
document.getElementById('asksend').onclick = ask;
document.getElementById('ask').addEventListener('keydown', e=>{ if(e.key==='Enter') ask(); });

/* ---------- render ---------- */
document.addEventListener('click', e=>{ if(e.target.classList.contains('star')) toggleMark(e.target.dataset.id); });
function render(){ renderRec(); renderProg(); renderPost(); renderMine(); }
document.getElementById('kw').value = LS.get('kw', DEFAULT_KW);
render();
</script>
